server.port=${SPRING_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_URL:192.168.1.114}:${DB_PORT:3306}/${DB:drivesense}
spring.datasource.username=${DB_USER:javauser}
spring.datasource.password=${DB_PASSWORD:DriveSenseJava}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_USERNAME:noreply@drivesense.local}
app.mail.from-name=DriveSense

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# APIs
google.api.key=${GOOGLE_GEOLOCATOR_API_KEY:}
